<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby Riley | Notes from the Heart Floor</title>
<meta name="description" content="A nursing blog by Ruby Riley: pre-nursing student and nurse tech on a cardiovascular floor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2622;--muted:#6d6258;--cocoa:#5b4636;--clay:#8a6b4f;--tan:#cdb99f;--sand:#eadfce;--linen:#faf7f2;--line:#ded2bf}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--linen);color:var(--ink);font:17px/1.65 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
a{color:var(--clay)}
:focus-visible{outline:3px solid var(--cocoa);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
header.hero{background:var(--sand);padding:52px 0 0;overflow:hidden}
.intro{display:grid;grid-template-columns:1fr 230px;gap:34px;align-items:center}
.hero h1{font-size:clamp(2.1rem,6vw,3.3rem);font-weight:700;color:var(--cocoa)}
.hero p{margin:14px 0 0;color:var(--muted);max-width:50ch}
.now{display:inline-block;margin-top:20px;background:var(--cocoa);color:var(--linen);border-radius:10px;padding:8px 16px;font-size:.95rem;font-weight:500}
.photo{width:230px;height:290px;object-fit:cover;object-position:50% 20%;border-radius:115px 115px 14px 14px;border:6px solid var(--linen);box-shadow:0 10px 30px rgba(91,70,54,.22)}
svg.ecg{display:block;width:100%;height:80px;margin-top:26px}
.ecg path{fill:none;stroke:var(--clay);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dashoffset:0}}
h2.section{font-size:1.7rem;color:var(--cocoa);margin:44px 0 6px}
.weekly{display:grid;gap:12px;margin-top:14px}
.week{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--clay);border-radius:10px;padding:14px 18px}
.week time{font-weight:700;color:var(--clay);font-size:.9rem}
.week p{margin:4px 0 0}
nav.tags{padding:12px 0 6px;display:flex;flex-wrap:wrap;gap:8px}
nav.tags button{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer}
nav.tags button[aria-pressed=true]{background:var(--cocoa);border-color:var(--cocoa);color:#fff}
.month{margin:38px 0 6px;font-size:1.05rem;color:var(--clay);border-bottom:2px solid var(--line);padding-bottom:6px}
article{margin:26px 0 34px;display:grid;grid-template-columns:78px 1fr;gap:6px 22px}
.date{font-weight:700;color:var(--clay);line-height:1.2;padding-top:6px}
.date small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
article h2{font-size:1.5rem;color:var(--cocoa)}
.tag{display:inline-block;margin-top:6px;font-size:.8rem;background:var(--sand);color:var(--cocoa);padding:2px 10px;border-radius:6px}
article p{margin:12px 0 0;max-width:62ch}
.learned{margin-top:16px;background:var(--sand);border-left:5px solid var(--clay);padding:12px 16px;border-radius:0 10px 10px 0}
.learned b{color:var(--cocoa)}
section.about{background:var(--sand);padding:44px 0;margin-top:30px}
section.about h2{font-size:1.6rem;margin-bottom:18px;color:var(--cocoa)}
.about ol{list-style:none;margin:0;padding:0;border-left:3px solid var(--tan)}
.about li{padding:6px 0 10px 18px;position:relative}
.about li::before{content:"";position:absolute;left:-9px;top:15px;width:13px;height:13px;border-radius:50%;background:var(--clay)}
.about li span{font-weight:700;margin-right:8px;color:var(--cocoa)}
footer{padding:30px 0 50px;color:var(--muted);font-size:.9rem}
@media (max-width:600px){.intro{grid-template-columns:1fr;text-align:left}.photo{order:-1;width:170px;height:215px;border-radius:85px 85px 12px 12px}article{grid-template-columns:1fr}.date small{display:inline;margin-left:8px}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="intro">
      <div>
        <h1>Notes from the heart floor</h1>
        <p id="blurb"></p>
        <span class="now" id="now"></span>
      </div>
      <img class="photo" src="headshot.jpg" alt="Portrait of Ruby Riley">
    </div>
  </div>
  <svg class="ecg" viewBox="0 0 1000 80" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 45 H200 L225 45 L240 18 L262 72 L282 5 L300 54 L315 45 H520 L545 45 L560 18 L582 72 L602 5 L620 54 L635 45 H1000"/>
  </svg>
</header>

<main class="wrap">
  <h2 class="section">This week</h2>
  <div class="weekly" id="weekly"></div>

  <h2 class="section">Monthly posts</h2>
  <nav class="tags" id="tags" aria-label="Filter posts by topic"></nav>
  <div id="feed" aria-live="polite"></div>
</main>

<section class="about" id="about">
  <div class="wrap">
    <h2>The road so far</h2>
    <ol id="timeline"></ol>
  </div>
</section>

<footer><div class="wrap">
  <p>This blog shares my personal experiences and learning. It never includes patient information and isn't medical advice.</p>
</div></footer>

<script src="posts.js"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = (d, o) => new Date(d + (d.length === 7 ? "-01" : "") + "T00:00:00").toLocaleDateString("en-US", o);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.title = PROFILE.name + " | Notes from the Heart Floor";
$("blurb").textContent = PROFILE.blurb;
$("now").innerHTML = esc(PROFILE.role) + ", " + esc(PROFILE.place);

$("weekly").innerHTML = WEEKLY.slice().sort((a, b) => b.date.localeCompare(a.date)).map(w =>
  `<div class="week"><time>${fmt(w.date, { month: "long", day: "numeric", year: "numeric" })}</time><p>${esc(w.text)}</p></div>`).join("");

let active = "All";
const posts = POSTS.slice().sort((a, b) => b.date.localeCompare(a.date));
const tags = ["All", ...new Set(posts.map(p => p.tag))];

function renderTags() {
  $("tags").innerHTML = tags.map(t =>
    `<button type="button" aria-pressed="${t === active}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("tags").querySelectorAll("button").forEach(b => b.onclick = () => { active = b.dataset.t; renderTags(); renderFeed(); });
}

function renderFeed() {
  let lastMonth = "", html = "";
  posts.filter(p => active === "All" || p.tag === active).forEach(p => {
    const month = fmt(p.date, { month: "long", year: "numeric" });
    if (month !== lastMonth) { html += `<h3 class="month">${month}</h3>`; lastMonth = month; }
    html += `<article>
      <div class="date">${fmt(p.date, { month: "short", day: "numeric" })}<small>${fmt(p.date, { year: "numeric" })}</small></div>
      <div><h2>${esc(p.title)}</h2><span class="tag">${esc(p.tag)}</span>
      ${p.body.map(t => `<p>${esc(t)}</p>`).join("")}
      <div class="learned"><b>What I learned:</b> ${esc(p.learned)}</div></div>
    </article>`;
  });
  $("feed").innerHTML = html || "<p>No posts under this topic yet.</p>";
}

$("timeline").innerHTML = MILESTONES.map(m =>
  `<li><span>${fmt(m.date, { month: "short", year: "numeric" })}</span>${esc(m.text)}</li>`).join("");

renderTags(); renderFeed();
</script>
</body>
</html>
